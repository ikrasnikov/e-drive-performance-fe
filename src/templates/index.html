<!doctype html>
<html lang="{{lang}}">
  {{> head}}
  <body class="page">
    <a class="skip-link" href="#main">{{t.a11y.skipToContent}}</a>

    {{> header}}

    <!-- prettier-ignore -->
    <main id="main" class="page__main">
      {{> sections/hero}}
      {{> sections/services}}
      <!-- "About us" in the navigation scrolls to the start of this group of sections -->
      <div id="about">
        {{> sections/diagnostics}}
        {{> sections/repair}}
      </div>
      {{> sections/advantages}}
      {{> sections/booking}}
      {{> sections/contacts}}
    </main>

    {{> footer}}

    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>

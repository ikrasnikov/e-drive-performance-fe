<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{meta.title}}</title>
  <meta name="description" content="{{meta.description}}" />
  <meta name="theme-color" content="#0f1216" />

  <!-- Styles and fonts are loaded in <head> (not from JS), so the page never renders unstyled -->
  <link
    rel="preload"
    href="/assets/fonts/montserrat-latin-wght-normal.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />
  {{#if hasCyrillic}}
  <link
    rel="preload"
    href="/assets/fonts/montserrat-cyrillic-wght-normal.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />
  {{/if}}
  <link rel="stylesheet" href="/styles/main.scss" />

  <link rel="canonical" href="{{canonical}}" />
  {{#each alternates}}
  <link rel="alternate" hreflang="{{lang}}" href="{{href}}" />
  {{/each}}
  <link rel="alternate" hreflang="x-default" href="{{defaultHref}}" />

  <link rel="icon" href="{{base}}favicon.ico" sizes="32x32" />
  <link
    rel="icon"
    href="{{base}}icon-192.png"
    type="image/png"
    sizes="192x192"
  />
  <link rel="apple-touch-icon" href="{{base}}apple-touch-icon.png" />
  <link rel="manifest" href="{{base}}site.webmanifest" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{meta.title}}" />
  <meta property="og:description" content="{{meta.description}}" />
  <meta property="og:url" content="{{canonical}}" />
  <meta property="og:locale" content="{{t.meta.ogLocale}}" />
</head>

<section
  id="services"
  class="section services"
  aria-labelledby="services-title"
>
  <div class="container">
    <div class="section-header">
      <p class="eyebrow section-header__eyebrow">{{t.services.eyebrow}}</p>
      <h2 id="services-title" class="section-header__title">
        {{t.services.title}}
      </h2>
      <p class="section-header__lead">{{t.services.lead}}</p>
    </div>

    <ul class="services__list">
      {{#each site.services}}
      <li class="service-card">
        <span class="service-card__icon">{{icon icon}}</span>
        <h3 class="service-card__title">{{tr "services" id "title"}}</h3>
        <p class="service-card__text">{{tr "services" id "text"}}</p>
      </li>
      {{/each}}
    </ul>
  </div>
</section>
